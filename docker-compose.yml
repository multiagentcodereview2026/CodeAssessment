services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeassessment
      POSTGRES_DB: codeassessment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeassessment_password}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Keep the API available on the usual host port when it is free, but
      # allow Compose to start when another local service already owns 8000.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-codeassessment_password}
      - POSTGRES_USER=codeassessment
      - POSTGRES_DB=codeassessment
      - DOCKER_ENGINE_URL=http://execution-engine:8001/execute
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env file}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - DEBUG=${DEBUG:-false}
      - EXECUTION_CPU_LIMIT=1.0
      - EXECUTION_MEMORY_LIMIT=256m
      - EXECUTION_TIMEOUT_SECONDS=5
      - PUBLIC_ONLY_EXECUTION=${PUBLIC_ONLY_EXECUTION:-false}
      - DOCKER_ENGINE_REQUEST_TIMEOUT_SECONDS=120
    depends_on:
      postgres:
        condition: service_healthy
      execution-engine:
        condition: service_healthy
    entrypoint: ["sh", "-c", "if [ -z \"$$DATABASE_URL\" ]; then export DATABASE_URL=\"postgresql+psycopg://codeassessment:$$POSTGRES_PASSWORD@postgres:5432/codeassessment\"; fi; alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  dataset-importer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ../datasets/apps:/datasets:ro
    command: ["python", "-m", "dataset.import_apps", "--dataset-path", "/datasets/apps-first-100", "--limit", "100"]

  dataset-processor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    volumes:
      - ../datasets/apps:/datasets
    command: ["python", "-m", "dataset.merge_apps", "--input-root", "/datasets", "--output-path", "/datasets/apps-merged-0-1199"]

  codecontests-importer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ../datasets/code_assessment_1000:/codecontests:ro
    command: ["python", "-m", "dataset.import_codecontests", "--dataset-path", "/codecontests/dataset.jsonl"]

  newfacade-importer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ../datasets/newfacade-staging:/newfacade:ro
    command: ["python", "-m", "dataset.import_newfacade", "--dataset-path", "/newfacade/normalized-newfacade-stdio-complexity.jsonl", "--require-complexity"]

  newfacade-tag-curator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    volumes:
      - ../datasets/newfacade-staging:/newfacade
    command: ["python", "-m", "dataset.curate_newfacade_tags", "--source", "/newfacade/normalized-newfacade-stdio.jsonl", "--output", "/newfacade/normalized-newfacade-stdio-tagged.jsonl"]

  newfacade-oracle-verifier:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    volumes:
      - ../datasets/newfacade-staging:/newfacade:ro
    command: ["python", "-m", "dataset.verify_newfacade_oracles", "--raw-source", "/newfacade/LeetCodeDataset-train.jsonl", "/newfacade/LeetCodeDataset-test.jsonl", "--normalized", "/newfacade/normalized-newfacade-stdio-tagged.jsonl"]

  # Explicit, one-off data-preparation job. It is never started by `docker
  # compose up`; set GROQ_API_KEY in the invoking shell before running it.
  newfacade-complexity-enricher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - ../datasets/newfacade-staging:/newfacade
    command: ["python", "-m", "dataset.enrich_newfacade_complexities", "--source", "/newfacade/normalized-newfacade-stdio-tagged.jsonl", "--output", "/newfacade/normalized-newfacade-stdio-complexity.jsonl"]

  newfacade-complexity-verifier:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    volumes:
      - ../datasets/newfacade-staging:/newfacade:ro
    command: ["python", "-m", "dataset.validate_newfacade_complexities", "--dataset-path", "/newfacade/normalized-newfacade-stdio-complexity.jsonl"]

  # Applies only reviewed, closed-set TC/SC metadata. Problem statements,
  # public/hidden test cases, users, and submissions are left unchanged.
  newfacade-complexity-importer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - ../datasets/newfacade-staging:/newfacade:ro
    command: ["python", "-m", "dataset.migrate_problem_complexities", "--dataset-path", "/newfacade/normalized-newfacade-stdio-complexity.jsonl"]

  execution-engine:
    build:
      context: ./docker-execution-engine
      dockerfile: docker/engine.Dockerfile
    environment:
      - EXECUTION_CPU_LIMIT=1.0
      - EXECUTION_MEMORY_LIMIT=256m
      - EXECUTION_TIMEOUT_SECONDS=5
      # Limit concurrent runner jobs to 2 on Free Tier to avoid RAM starvation.
      - EXECUTION_MAX_CONCURRENT_JOBS=${EXECUTION_MAX_CONCURRENT_JOBS:-2}
      - EXECUTION_DOCKER_SCHEDULING_GRACE_SECONDS=3
      - EXECUTION_DOCKER_STARTUP_GRACE_SECONDS=20
      - EXECUTION_DEBUG_LOGS=${EXECUTION_DEBUG_LOGS:-0}
      - SANDBOX_VOLUME=${EXECUTION_SANDBOX_VOLUME:-codeassessment_execution-work}
      - SANDBOX_WORKSPACE_ROOT=/sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - execution-work:/sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  runner-python:
    build:
      context: ./docker
      dockerfile: python.Dockerfile
    image: codeassessment-python:latest
    profiles: ["tools"]

  runner-c:
    build:
      context: ./docker
      dockerfile: c.Dockerfile
    image: codeassessment-c:latest
    profiles: ["tools"]

  runner-cpp:
    build:
      context: ./docker
      dockerfile: cpp.Dockerfile
    image: codeassessment-cpp:latest
    profiles: ["tools"]

  runner-java:
    build:
      context: ./docker
      dockerfile: java.Dockerfile
    image: codeassessment-java:latest
    profiles: ["tools"]

volumes:
  postgres-data:
    name: codeassessment_postgres-data
  execution-work:
    name: ${EXECUTION_SANDBOX_VOLUME:-codeassessment_execution-work}
