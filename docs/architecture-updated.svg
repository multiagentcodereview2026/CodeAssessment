<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">CodeAssessment platform architecture</title>
  <desc id="desc">Student and instructor access flows through authentication, course management, code submission, Docker execution, deterministic assessment agents, and an optional bounded revision score projection loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a5f" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#375a7f"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #486581; }
      .label { font: 700 15px Arial, sans-serif; fill: #102a43; }
      .body { font: 400 13px Arial, sans-serif; fill: #243b53; }
      .small { font: 400 12px Arial, sans-serif; fill: #486581; }
      .section { font: 700 16px Arial, sans-serif; fill: #1f4e79; letter-spacing: .5px; }
      .box { stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .arrow { stroke: #375a7f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="800" y="42" text-anchor="middle" class="title">CodeAssessment Platform Architecture</text>
  <text x="800" y="68" text-anchor="middle" class="subtitle">Deterministic grading with explainable guidance and a bounded, Docker-verified score-projection loop</text>

  <!-- Access and submission -->
  <rect x="35" y="100" width="210" height="108" fill="#e3f2fd" stroke="#1e88e5" class="box"/>
  <text x="140" y="130" text-anchor="middle" class="label">Users</text>
  <text x="58" y="157" class="body">Student</text><text x="58" y="181" class="body">Instructor</text>
  <text x="150" y="157" class="small">practice, submit, learn</text><text x="150" y="181" class="small">courses, analytics</text>

  <rect x="285" y="100" width="210" height="108" fill="#e0f7fa" stroke="#0097a7" class="box"/>
  <text x="390" y="130" text-anchor="middle" class="label">Authentication</text>
  <text x="390" y="158" text-anchor="middle" class="body">JWT login and registration</text>
  <text x="390" y="181" text-anchor="middle" class="small">role-based access control</text>

  <rect x="535" y="100" width="230" height="108" fill="#e0f7fa" stroke="#0097a7" class="box"/>
  <text x="650" y="130" text-anchor="middle" class="label">Course management</text>
  <text x="650" y="158" text-anchor="middle" class="body">Courses, assignments, enrollment</text>
  <text x="650" y="181" text-anchor="middle" class="small">student and instructor scopes</text>

  <rect x="805" y="100" width="230" height="108" fill="#ede7f6" stroke="#673ab7" class="box"/>
  <text x="920" y="130" text-anchor="middle" class="label">Code submission</text>
  <text x="920" y="158" text-anchor="middle" class="body">Problem, language, source code</text>
  <text x="920" y="181" text-anchor="middle" class="small">run or submit endpoint</text>

  <rect x="1075" y="100" width="250" height="108" fill="#f3e5f5" stroke="#7b1fa2" class="box"/>
  <text x="1200" y="130" text-anchor="middle" class="label">Docker execution engine</text>
  <text x="1200" y="158" text-anchor="middle" class="body">Compile, run public and hidden cases</text>
  <text x="1200" y="181" text-anchor="middle" class="small">CPU, memory, network and timeout limits</text>

  <path d="M245 154 H280" class="arrow"/><path d="M495 154 H530" class="arrow"/>
  <path d="M765 154 H800" class="arrow"/><path d="M1035 154 H1070" class="arrow"/>

  <!-- assessment -->
  <rect x="90" y="255" width="1420" height="210" fill="#fffdf5" stroke="#d9a441" stroke-width="2" rx="18"/>
  <text x="800" y="282" text-anchor="middle" class="section">ADAPTIVE MULTI-AGENT ASSESSMENT ENGINE</text>

  <rect x="125" y="305" width="205" height="120" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="227" y="333" text-anchor="middle" class="label">Correctness</text>
  <text x="145" y="360" class="body">Test verdicts</text><text x="145" y="381" class="body">Compile/runtime errors</text><text x="145" y="402" class="body">Edge-case evidence</text>

  <rect x="355" y="305" width="205" height="120" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="457" y="333" text-anchor="middle" class="label">Complexity</text>
  <text x="375" y="360" class="body">Core-method AST</text><text x="375" y="381" class="body">Time and space ranks</text><text x="375" y="402" class="body">AI corroboration if uncertain</text>

  <rect x="585" y="305" width="205" height="120" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="687" y="333" text-anchor="middle" class="label">Style</text>
  <text x="605" y="360" class="body">Readability</text><text x="605" y="381" class="body">Structure and naming</text><text x="605" y="402" class="body">Measured findings</text>

  <rect x="815" y="305" width="205" height="120" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="917" y="333" text-anchor="middle" class="label">Aggregation</text>
  <text x="835" y="360" class="body">Weighted rubric</text><text x="835" y="381" class="body">Correctness ceiling</text><text x="835" y="402" class="body">Saved assessment</text>

  <rect x="1045" y="305" width="205" height="120" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="1147" y="333" text-anchor="middle" class="label">Explainability</text>
  <text x="1065" y="360" class="body">Human-readable evidence</text><text x="1065" y="381" class="body">Focused next improvement</text><text x="1065" y="402" class="body">Fallback when AI fails</text>

  <rect x="1275" y="305" width="205" height="120" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="1377" y="333" text-anchor="middle" class="label">Recommendation</text>
  <text x="1295" y="360" class="body">Topic and difficulty</text><text x="1295" y="381" class="body">Learning-stage guidance</text><text x="1295" y="402" class="body">Next problem</text>

  <path d="M1200 209 V240 H227 V300" class="arrow"/>
  <path d="M330 365 H350" class="arrow"/><path d="M560 365 H580" class="arrow"/><path d="M790 365 H810" class="arrow"/><path d="M1020 365 H1040" class="arrow"/><path d="M1250 365 H1270" class="arrow"/>

  <!-- saved result -->
  <rect x="250" y="500" width="1100" height="92" fill="#e8f5e9" stroke="#43a047" class="box"/>
  <text x="800" y="530" text-anchor="middle" class="label">Saved assessment and dashboards</text>
  <text x="800" y="555" text-anchor="middle" class="body">PostgreSQL stores scores, redacted execution evidence, feedback, recommendations and submission history</text>
  <text x="800" y="576" text-anchor="middle" class="small">Student dashboard: score, explanation, learning stage, verified projection when released</text>
  <path d="M1377 426 V480 H800 V495" class="arrow"/>

  <!-- bounded revision loop -->
  <rect x="110" y="635" width="1380" height="300" fill="#f4f8ff" stroke="#3973b8" stroke-width="2" stroke-dasharray="10 7" rx="18"/>
  <text x="800" y="665" text-anchor="middle" class="section">OPTIONAL BOUNDED REVISION + SCORE-PROJECTION LOOP</text>

  <rect x="150" y="705" width="210" height="105" fill="#e3f2fd" stroke="#1e88e5" class="box"/>
  <text x="255" y="734" text-anchor="middle" class="label">Student requests guide</text>
  <text x="170" y="762" class="body">Load saved evidence</text><text x="170" y="783" class="body">Create one durable job</text>

  <rect x="405" y="705" width="220" height="105" fill="#ede7f6" stroke="#673ab7" class="box"/>
  <text x="515" y="734" text-anchor="middle" class="label">Revision agent</text>
  <text x="425" y="762" class="body">Staged steps and private patch</text><text x="425" y="783" class="body">AI output schema validated</text>

  <rect x="670" y="705" width="220" height="105" fill="#f3e5f5" stroke="#7b1fa2" class="box"/>
  <text x="780" y="734" text-anchor="middle" class="label">Validate candidate</text>
  <text x="690" y="762" class="body">AST targets and signature</text><text x="690" y="783" class="body">No hidden data to AI</text>

  <rect x="935" y="705" width="220" height="105" fill="#fff3e0" stroke="#ef6c00" class="box"/>
  <text x="1045" y="734" text-anchor="middle" class="label">Docker + score-cal</text>
  <text x="955" y="762" class="body">Run candidate on judge cases</text><text x="955" y="783" class="body">Recompute all components</text>

  <rect x="1200" y="705" width="220" height="105" fill="#e8f5e9" stroke="#43a047" class="box"/>
  <text x="1310" y="734" text-anchor="middle" class="label">Release gate</text>
  <text x="1220" y="762" class="body">Gain, no regression, complexity</text><text x="1220" y="783" class="body">Pass or stop after limit</text>

  <path d="M360 757 H400" class="arrow"/><path d="M625 757 H665" class="arrow"/><path d="M890 757 H930" class="arrow"/><path d="M1155 757 H1195" class="arrow"/>
  <path d="M1310 810 V870 H515 V815" class="arrow dashed"/>
  <text x="900" y="864" text-anchor="middle" class="small">No pass and attempts remain: regenerate or retry within the durable job budget</text>

  <rect x="355" y="850" width="220" height="60" fill="#e8f5e9" stroke="#43a047" class="box"/>
  <text x="465" y="876" text-anchor="middle" class="label">Verified projection</text><text x="465" y="895" text-anchor="middle" class="small">Publish guide + measured score</text>
  <rect x="1025" y="850" width="220" height="60" fill="#fff8e1" stroke="#d9a441" class="box"/>
  <text x="1135" y="876" text-anchor="middle" class="label">Not verified</text><text x="1135" y="895" text-anchor="middle" class="small">Keep guide, hide projection</text>
  <path d="M1310 810 V840 H465 V845" class="arrow"/><path d="M1310 810 V840 H1135 V845" class="arrow"/>

  <!-- storage/security -->
  <rect x="35" y="960" width="470" height="55" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="270" y="983" text-anchor="middle" class="label">Security</text><text x="270" y="1002" text-anchor="middle" class="small">JWT/RBAC, private judge data, isolated containers, no secrets in execution engine</text>
  <rect x="565" y="960" width="470" height="55" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="800" y="983" text-anchor="middle" class="label">Infrastructure</text><text x="800" y="1002" text-anchor="middle" class="small">React + nginx, FastAPI, LangGraph, Docker execution service, PostgreSQL</text>
  <rect x="1095" y="960" width="470" height="55" fill="#f1f5f9" stroke="#64748b" class="box"/>
  <text x="1330" y="983" text-anchor="middle" class="label">Trust boundary</text><text x="1330" y="1002" text-anchor="middle" class="small">AI proposes; deterministic agents and Docker judge decide scores</text>
</svg>
