<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">CodeAssessment Platform Architecture</title>
  <desc id="desc">Clean architecture diagram showing authentication, code submission, Docker execution, deterministic assessment agents, dashboards, storage, and the bounded verified score-projection loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#365f85"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#102a43}.subtitle{font:400 14px Arial,sans-serif;fill:#486581}.h{font:700 15px Arial,sans-serif;fill:#102a43}.t{font:400 13px Arial,sans-serif;fill:#243b53}.s{font:400 12px Arial,sans-serif;fill:#486581}.section{font:700 16px Arial,sans-serif;fill:#1f4e79}.box{stroke-width:1.5;rx:12;filter:url(#shadow)}.a{stroke:#365f85;stroke-width:2;fill:none;marker-end:url(#arrow)}.d{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1500" height="980" fill="#f7fbff"/>
  <text x="750" y="42" text-anchor="middle" class="title">CodeAssessment Platform Architecture</text>
  <text x="750" y="68" text-anchor="middle" class="subtitle">Secure code execution, evidence-based assessment, and verified revision guidance</text>

  <rect x="30" y="100" width="180" height="100" fill="#e3f2fd" stroke="#1e88e5" class="box"/><text x="120" y="130" text-anchor="middle" class="h">Users</text><text x="55" y="160" class="t">Student</text><text x="55" y="183" class="t">Instructor</text>
  <rect x="250" y="100" width="200" height="100" fill="#e0f7fa" stroke="#0097a7" class="box"/><text x="350" y="130" text-anchor="middle" class="h">Authentication</text><text x="350" y="160" text-anchor="middle" class="t">JWT login and registration</text><text x="350" y="183" text-anchor="middle" class="s">Role-based access control</text>
  <rect x="490" y="100" width="220" height="100" fill="#e0f7fa" stroke="#0097a7" class="box"/><text x="600" y="130" text-anchor="middle" class="h">Course management</text><text x="600" y="160" text-anchor="middle" class="t">Courses, assignments, enrollment</text><text x="600" y="183" text-anchor="middle" class="s">Student and instructor scopes</text>
  <rect x="750" y="100" width="210" height="100" fill="#ede7f6" stroke="#673ab7" class="box"/><text x="855" y="130" text-anchor="middle" class="h">Code submission</text><text x="855" y="160" text-anchor="middle" class="t">Problem, language, source</text><text x="855" y="183" text-anchor="middle" class="s">Run or submit endpoint</text>
  <rect x="1000" y="100" width="230" height="100" fill="#f3e5f5" stroke="#7b1fa2" class="box"/><text x="1115" y="130" text-anchor="middle" class="h">Docker execution</text><text x="1115" y="160" text-anchor="middle" class="t">Compile and run judge cases</text><text x="1115" y="183" text-anchor="middle" class="s">Limits for CPU, memory, time</text>
  <rect x="1270" y="100" width="200" height="100" fill="#e8f5e9" stroke="#43a047" class="box"/><text x="1370" y="130" text-anchor="middle" class="h">Dashboards</text><text x="1370" y="160" text-anchor="middle" class="t">Student progress</text><text x="1370" y="183" text-anchor="middle" class="t">Instructor analytics</text>
  <path d="M210 150h35M450 150h35M710 150h35M960 150h35M1230 150h35" class="a"/>

  <rect x="90" y="250" width="1320" height="185" fill="#fffdf5" stroke="#d9a441" stroke-width="2" rx="16"/><text x="750" y="280" text-anchor="middle" class="section">DETERMINISTIC ASSESSMENT ENGINE</text>
  <rect x="130" y="305" width="230" height="95" fill="#fff8e1" stroke="#d9a441" class="box"/><text x="245" y="334" text-anchor="middle" class="h">Correctness</text><text x="150" y="363" class="t">Public and hidden verdicts</text><text x="150" y="384" class="t">Compile and runtime evidence</text>
  <rect x="390" y="305" width="230" height="95" fill="#fff8e1" stroke="#d9a441" class="box"/><text x="505" y="334" text-anchor="middle" class="h">Complexity</text><text x="410" y="363" class="t">Core-method AST analysis</text><text x="410" y="384" class="t">Time and auxiliary space</text>
  <rect x="650" y="305" width="230" height="95" fill="#fff8e1" stroke="#d9a441" class="box"/><text x="765" y="334" text-anchor="middle" class="h">Style and structure</text><text x="670" y="363" class="t">Naming and readability</text><text x="670" y="384" class="t">Measured code findings</text>
  <rect x="910" y="305" width="230" height="95" fill="#fff8e1" stroke="#d9a441" class="box"/><text x="1025" y="334" text-anchor="middle" class="h">Score aggregation</text><text x="930" y="363" class="t">Weighted rubric</text><text x="930" y="384" class="t">Correctness ceiling</text>
  <rect x="1170" y="305" width="200" height="95" fill="#fff8e1" stroke="#d9a441" class="box"/><text x="1270" y="334" text-anchor="middle" class="h">Evidence store</text><text x="1190" y="363" class="t">Redacted results</text><text x="1190" y="384" class="t">Submission history</text>
  <path d="M1115 201v35H245v64M360 352h25M620 352h25M880 352h25M1140 352h25" class="a"/>

  <rect x="145" y="475" width="1220" height="95" fill="#fdeff2" stroke="#d65a73" class="box"/><text x="755" y="505" text-anchor="middle" class="section">TEACHING OUTPUTS</text>
  <text x="260" y="540" text-anchor="middle" class="h">Explainability</text><text x="530" y="540" text-anchor="middle" class="h">Recommendations</text><text x="800" y="540" text-anchor="middle" class="h">Stage-wise revision</text><text x="1080" y="540" text-anchor="middle" class="h">Score projection</text>
  <text x="260" y="558" text-anchor="middle" class="s">Why the score changed</text><text x="530" y="558" text-anchor="middle" class="s">Topic and difficulty</text><text x="800" y="558" text-anchor="middle" class="s">One focused next change</text><text x="1080" y="558" text-anchor="middle" class="s">Only after private verification</text>
  <path d="M1270 400v55H260v15M260 570h260M530 570h270M800 570h280" class="a"/>

  <rect x="100" y="620" width="1300" height="245" fill="#f2f7ff" stroke="#3973b8" stroke-width="2" stroke-dasharray="10 7" rx="16"/><text x="750" y="650" text-anchor="middle" class="section">BOUNDED REVISION AND SCORE-PROJECTION LOOP</text>
  <rect x="140" y="690" width="205" height="95" fill="#e3f2fd" stroke="#1e88e5" class="box"/><text x="242" y="720" text-anchor="middle" class="h">Request guide</text><text x="160" y="750" class="t">Load saved evidence</text><text x="160" y="771" class="t">Create durable job</text>
  <rect x="385" y="690" width="220" height="95" fill="#ede7f6" stroke="#673ab7" class="box"/><text x="495" y="720" text-anchor="middle" class="h">Generate private draft</text><text x="405" y="750" class="t">AI steps and source patch</text><text x="405" y="771" class="t">Schema and target checks</text>
  <rect x="645" y="690" width="220" height="95" fill="#f3e5f5" stroke="#7b1fa2" class="box"/><text x="755" y="720" text-anchor="middle" class="h">Judge candidate</text><text x="665" y="750" class="t">Same Docker judge</text><text x="665" y="771" class="t">Same score calculator</text>
  <rect x="905" y="690" width="220" height="95" fill="#fff3e0" stroke="#ef6c00" class="box"/><text x="1015" y="720" text-anchor="middle" class="h">Compare scores</text><text x="925" y="750" class="t">Candidate versus baseline</text><text x="925" y="771" class="t">Check regressions</text>
  <rect x="1165" y="690" width="190" height="95" fill="#e8f5e9" stroke="#43a047" class="box"/><text x="1260" y="720" text-anchor="middle" class="h">Release gate</text><text x="1185" y="750" class="t">Improved and safe?</text><text x="1185" y="771" class="t">Bounded attempts</text>
  <path d="M345 738h35M605 738h35M865 738h35M1125 738h35" class="a"/>
  <path d="M1260 785v45H495v-40" class="a d"/><text x="850" y="824" text-anchor="middle" class="s">Fail with attempts remaining: retry. Limit reached: keep guide, hide projection.</text>
  <rect x="420" y="840" width="240" height="40" fill="#e8f5e9" stroke="#43a047" class="box"/><text x="540" y="866" text-anchor="middle" class="h">Verified guide and projection</text>
  <rect x="900" y="840" width="240" height="40" fill="#fff8e1" stroke="#d9a441" class="box"/><text x="1020" y="866" text-anchor="middle" class="h">Not verified guide only</text>
  <path d="M1260 785v35H540v15M1260 785v35h-240v15" class="a"/>

  <rect x="40" y="910" width="430" height="45" fill="#f1f5f9" stroke="#64748b" class="box"/><text x="255" y="938" text-anchor="middle" class="h">PostgreSQL: users, problems, submissions, analytics</text>
  <rect x="535" y="910" width="430" height="45" fill="#f1f5f9" stroke="#64748b" class="box"/><text x="750" y="938" text-anchor="middle" class="h">Security: JWT, RBAC, secrets, isolated runners</text>
  <rect x="1030" y="910" width="430" height="45" fill="#f1f5f9" stroke="#64748b" class="box"/><text x="1245" y="938" text-anchor="middle" class="h">Optional Groq: clarity, guidance, corroboration</text>
</svg>
